---
- name: check-platform | Reject platforms with unavailable OpenJDK repositories
  ansible.builtin.assert:
    that:
      - not (ansible_facts['distribution'] == 'Debian' and ansible_facts['distribution_major_version'] == '11')
      - not (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_version'] == '23.10')
      - not (ansible_facts['distribution'] == 'Fedora' and ansible_facts['distribution_major_version'] in ['38', '39'])
      - not (ansible_facts['os_family'] == 'Suse' and ansible_facts['distribution_version'] == '15.5')
    fail_msg: "OpenJDK repository is unavailable for {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}."
    quiet: true
